<svg viewBox="0 0 700 260" role="img" aria-label="Ciclo de vida de um registro de série entre os estados pending, synced e deleted">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="oklch(0.45 0.012 264)"/>
        </marker>
        <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="oklch(0.46 0.135 132)"/>
        </marker>
      </defs>
      <g font-family="Geist, sans-serif" font-size="12">

        <!-- pending -->
        <rect x="40" y="86" width="146" height="52" rx="10" fill="oklch(0.87 0.23 126 / 16%)" stroke="oklch(0.46 0.135 132)" stroke-width="1.5"/>
        <text x="113" y="107" text-anchor="middle" font-family="Geist Mono, monospace" font-size="13" font-weight="600" fill="oklch(0.23 0.012 264)">pending</text>
        <text x="113" y="125" text-anchor="middle" font-size="10.5" fill="oklch(0.45 0.012 264)">existe só no aparelho</text>

        <!-- synced -->
        <rect x="290" y="86" width="146" height="52" rx="10" fill="oklch(0.962 0.003 264)" stroke="oklch(0.45 0.012 264)" stroke-width="1.5"/>
        <text x="363" y="107" text-anchor="middle" font-family="Geist Mono, monospace" font-size="13" font-weight="600" fill="oklch(0.23 0.012 264)">synced</text>
        <text x="363" y="125" text-anchor="middle" font-size="10.5" fill="oklch(0.45 0.012 264)">local + Supabase</text>

        <!-- deleted -->
        <rect x="540" y="86" width="146" height="52" rx="10" fill="none" stroke="oklch(0.45 0.012 264)" stroke-width="1.5" stroke-dasharray="5 4"/>
        <text x="613" y="107" text-anchor="middle" font-family="Geist Mono, monospace" font-size="13" font-weight="600" fill="oklch(0.23 0.012 264)">deleted</text>
        <text x="613" y="125" text-anchor="middle" font-size="10.5" fill="oklch(0.45 0.012 264)">tombstone</text>

        <!-- entrada -->
        <path d="M 113 34 L 113 80" stroke="oklch(0.46 0.135 132)" stroke-width="1.5" marker-end="url(#ahv)"/>
        <text x="122" y="28" font-size="11" font-weight="500" fill="oklch(0.46 0.135 132)">marcar série  →  INSERT no SQLite</text>

        <!-- pending -> synced -->
        <path d="M 190 100 L 284 100" stroke="oklch(0.45 0.012 264)" stroke-width="1.5" marker-end="url(#ah)"/>
        <text x="237" y="92" text-anchor="middle" font-size="10.5" fill="oklch(0.45 0.012 264)">upsert aceito</text>

        <!-- synced -> deleted -->
        <path d="M 440 100 L 534 100" stroke="oklch(0.45 0.012 264)" stroke-width="1.5" marker-end="url(#ah)"/>
        <text x="487" y="92" text-anchor="middle" font-size="10.5" fill="oklch(0.45 0.012 264)">desmarcar</text>

        <!-- pending -> apagado -->
        <path d="M 113 144 L 113 196" stroke="oklch(0.45 0.012 264)" stroke-width="1.5" marker-end="url(#ah)"/>
        <text x="104" y="216" text-anchor="middle" font-size="10.5" fill="oklch(0.45 0.012 264)">desmarcar antes do envio:</text>
        <text x="104" y="231" text-anchor="middle" font-size="10.5" fill="oklch(0.45 0.012 264)">DELETE local, nada a avisar</text>

        <!-- deleted -> apagado -->
        <path d="M 613 144 L 613 196" stroke="oklch(0.45 0.012 264)" stroke-width="1.5" marker-end="url(#ah)"/>
        <text x="613" y="216" text-anchor="middle" font-size="10.5" fill="oklch(0.45 0.012 264)">DELETE remoto confirmado</text>
        <text x="613" y="231" text-anchor="middle" font-size="10.5" fill="oklch(0.45 0.012 264)">e só então DELETE local</text>

        <!-- falha volta -->
        <path d="M 284 122 C 240 150, 190 150, 190 128" stroke="oklch(0.45 0.012 264)" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ah)"/>
        <text x="237" y="160" text-anchor="middle" font-size="10" fill="oklch(0.60 0.010 264)">falha de rede: continua pending</text>
      </g>
    </svg>
