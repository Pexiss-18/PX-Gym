        <rect x="558" y="42" width="142" height="46" rx="8" fill="oklch(0.988 0.002 264)" stroke="oklch(0.78 0.008 264)" stroke-width="1.2"/>
        <text x="629" y="63" text-anchor="middle" font-size="11.5" font-weight="600">useLiveQuery</text>
