        <text x="0" y="146" font-size="10" font-weight="500" letter-spacing="0.08em" fill="oklch(0.45 0.012 264)">DEPOIS — QUANDO HOUVER CONEXÃO</text>
        <line x1="0" y1="154" x2="700" y2="154" stroke="oklch(0.45 0.012 264)" stroke-width="1.5"/>

        <rect x="0" y="172" width="150" height="56" rx="8" fill="oklch(0.962 0.003 264)" stroke="oklch(0.78 0.008 264)" stroke-width="1.2"/>
