        <path d="M 152 65 L 180 65" stroke="oklch(0.45 0.012 264)" stroke-width="1.5" marker-end="url(#ah2)"/>
        <path d="M 338 65 L 366 65" stroke="oklch(0.45 0.012 264)" stroke-width="1.5" marker-end="url(#ah2)"/>
        <path d="M 524 65 L 552 65" stroke="oklch(0.45 0.012 264)" stroke-width="1.5" marker-end="url(#ah2)"/>

