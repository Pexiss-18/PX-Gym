        <text x="447" y="219" text-anchor="middle" font-size="9.5" fill="oklch(0.45 0.012 264)">delete por lote</text>

        <rect x="558" y="172" width="142" height="56" rx="8" fill="oklch(0.962 0.003 264)" stroke="oklch(0.45 0.012 264)" stroke-width="1.5"/>
        <text x="629" y="192" text-anchor="middle" font-size="11.5" font-weight="600">Postgres</text>
        <text x="629" y="207" text-anchor="middle" font-size="9.5" fill="oklch(0.45 0.012 264)">set_logs</text>
        <text x="629" y="219" text-anchor="middle" font-size="9.5" fill="oklch(0.45 0.012 264)">RLS por dono</text>

        <path d="M 152 200 L 180 200" stroke="oklch(0.45 0.012 264)" stroke-width="1.5" marker-end="url(#ah2)"/>
        <path d="M 338 200 L 366 200" stroke="oklch(0.45 0.012 264)" stroke-width="1.5" marker-end="url(#ah2)"/>
        <path d="M 524 200 L 552 200" stroke="oklch(0.45 0.012 264)" stroke-width="1.5" marker-end="url(#ah2)"/>

        <path d="M 447 232 L 447 258 L 261 258 L 261 234" stroke="oklch(0.46 0.135 132)" stroke-width="1.4" fill="none" marker-end="url(#ah2)"/>
        <text x="354" y="274" text-anchor="middle" font-size="10" fill="oklch(0.46 0.135 132)">sucesso → marca synced / apaga o tombstone local</text>
