        <text x="261" y="219" text-anchor="middle" font-size="9.5" fill="oklch(0.45 0.012 264)">checa conectividade</text>

        <rect x="372" y="172" width="150" height="56" rx="8" fill="oklch(0.962 0.003 264)" stroke="oklch(0.78 0.008 264)" stroke-width="1.2"/>
