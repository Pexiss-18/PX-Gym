            <path d="M 0 0 L 10 5 L 0 10 z" fill="oklch(0.45 0.012 264)"/>
          </marker>
        </defs>

        <!-- faixa 1: imediato -->
        <text x="0" y="16" font-size="10" font-weight="500" letter-spacing="0.08em" fill="oklch(0.46 0.135 132)">IMEDIATO — SEM REDE</text>
        <line x1="0" y1="24" x2="700" y2="24" stroke="oklch(0.87 0.23 126)" stroke-width="2"/>

