        <text x="75" y="63" text-anchor="middle" font-size="11.5" font-weight="600">toque na série</text>
        <text x="75" y="78" text-anchor="middle" font-size="10" fill="oklch(0.45 0.012 264)">tela do exercício</text>

        <rect x="186" y="42" width="150" height="46" rx="8" fill="oklch(0.988 0.002 264)" stroke="oklch(0.78 0.008 264)" stroke-width="1.2"/>
