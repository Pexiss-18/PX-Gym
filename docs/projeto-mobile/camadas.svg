<svg viewBox="0 0 700 210" role="img" aria-label="Direção das dependências: interface e infraestrutura apontam para o domínio">
      <g font-family="Geist, sans-serif">
        <defs>
          <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="oklch(0.46 0.135 132)"/>
          </marker>
        </defs>

        <rect x="0" y="30" width="176" height="120" rx="10" fill="oklch(0.988 0.002 264)" stroke="oklch(0.78 0.008 264)" stroke-width="1.2"/>
        <text x="88" y="54" text-anchor="middle" font-size="12" font-weight="600">Apresentação</text>
        <text x="88" y="76" text-anchor="middle" font-size="10" fill="oklch(0.45 0.012 264)">telas Expo Router</text>
        <text x="88" y="92" text-anchor="middle" font-size="10" fill="oklch(0.45 0.012 264)">componentes</text>
        <text x="88" y="108" text-anchor="middle" font-size="10" fill="oklch(0.45 0.012 264)">hooks de leitura</text>

        <rect x="262" y="30" width="176" height="120" rx="10" fill="oklch(0.87 0.23 126 / 16%)" stroke="oklch(0.46 0.135 132)" stroke-width="1.6"/>
        <text x="350" y="54" text-anchor="middle" font-size="12" font-weight="600">Domínio · @px/core</text>
        <text x="350" y="76" text-anchor="middle" font-size="10" fill="oklch(0.45 0.012 264)">entidades e regras</text>
        <text x="350" y="92" text-anchor="middle" font-size="10" fill="oklch(0.45 0.012 264)">casos de uso</text>
        <text x="350" y="108" text-anchor="middle" font-size="10" fill="oklch(0.45 0.012 264)">ports (interfaces)</text>
        <text x="350" y="132" text-anchor="middle" font-size="9.5" font-weight="500" fill="oklch(0.46 0.135 132)">383 testes</text>

        <rect x="524" y="30" width="176" height="120" rx="10" fill="oklch(0.988 0.002 264)" stroke="oklch(0.78 0.008 264)" stroke-width="1.2"/>
        <text x="612" y="54" text-anchor="middle" font-size="12" font-weight="600">Infraestrutura</text>
        <text x="612" y="76" text-anchor="middle" font-size="10" fill="oklch(0.45 0.012 264)">Drizzle / SQLite</text>
        <text x="612" y="92" text-anchor="middle" font-size="10" fill="oklch(0.45 0.012 264)">Supabase · R2</text>
        <text x="612" y="108" text-anchor="middle" font-size="10" fill="oklch(0.45 0.012 264)">NetInfo · câmera · GPS</text>

        <path d="M 182 90 L 256 90" stroke="oklch(0.46 0.135 132)" stroke-width="1.6" marker-end="url(#ah3)"/>
        <path d="M 518 90 L 444 90" stroke="oklch(0.46 0.135 132)" stroke-width="1.6" marker-end="url(#ah3)"/>

        <text x="350" y="180" text-anchor="middle" font-size="10.5" fill="oklch(0.45 0.012 264)">as setas são a direção das dependências: nada dentro do domínio aponta para fora</text>
        <text x="350" y="197" text-anchor="middle" font-size="10.5" fill="oklch(0.45 0.012 264)">trocar SQLite, Supabase ou a fonte de academias não toca em uma linha de regra</text>
      </g>
    </svg>
