</div><!-- /slides -->
</div><!-- /stage -->
<div class="track"><div class="fill" id="fill"></div></div>
<div class="hint" id="hint">
  <span><kbd>→</kbd>avançar</span><span><kbd>O</kbd>visão geral</span><span><kbd>F</kbd>tela cheia</span>
</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var wrap = document.getElementById('slides');
  var fill = document.getElementById('fill');
  var hint = document.getElementById('hint');
  var total = slides.length;
  var i = 0;
  var over = false;

  // bottom rail, built from data-sec so the markup stays clean
  slides.forEach(function(s, n){
    var r = document.createElement('div');
    r.className = 'rail';
    r.innerHTML = '<span class="doc">Px GYM &nbsp;·&nbsp; Domínio e Interface Primeiro</span>'
      + '<span class="sep"></span>'
      + '<span class="sec">' + (s.dataset.sec || '') + '</span>'
      + '<span class="pg"><b>' + String(n + 1).padStart(2, '0') + '</b> / ' + String(total).padStart(2, '0') + '</span>';
    s.appendChild(r);
  });

  function fit(){
    if (over) { wrap.style.transform = ''; return; }
    var k = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    wrap.style.transform = 'scale(' + k + ')';
  }

  function show(n, push){
    i = Math.max(0, Math.min(total - 1, n));
    slides.forEach(function(s, k){ s.classList.toggle('is-active', k === i); });
    fill.style.transform = 'scaleX(' + ((i) / (total - 1)) + ')';
    if (push !== false) history.replaceState(null, '', '#' + (i + 1));
    if (over) slides[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function setOverview(on){
    over = on;
    stage.classList.toggle('overview', on);
    fit();
    if (on) slides[i].scrollIntoView({ block: 'center' });
  }

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter'){
      e.preventDefault(); if (over) setOverview(false); else show(i + 1);
    } else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace'){
      e.preventDefault(); show(i - 1);
    } else if (k === 'Home'){ e.preventDefault(); show(0); }
    else if (k === 'End'){ e.preventDefault(); show(total - 1); }
    else if (k === 'o' || k === 'O'){ e.preventDefault(); setOverview(!over); }
    else if (k === 'Escape'){ if (over) setOverview(false); }
    else if (k === 'f' || k === 'F'){
      e.preventDefault();
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    }
    hide();
  });

  slides.forEach(function(s, n){
    s.addEventListener('click', function(e){
      if (over){ show(n); setOverview(false); return; }
      if (e.target.closest('a[data-go]')) return;
      show(e.clientX > window.innerWidth * 0.36 ? i + 1 : i - 1);
      hide();
    });
  });

  // agenda: cada item aponta para o primeiro slide da seção (data-go = nome da seção)
  function goSection(name){
    for (var k = 0; k < total; k++) if (slides[k].dataset.sec === name) { show(k); return; }
  }
  document.querySelectorAll('a[data-go]').forEach(function(a){
    a.setAttribute('tabindex', '0');
    a.addEventListener('click', function(e){ e.stopPropagation(); goSection(a.dataset.go); });
    a.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); goSection(a.dataset.go); }
    });
  });

  var t = setTimeout(hide, 5200);
  function hide(){ clearTimeout(t); hint.classList.add('gone'); }

  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', function(){
    var n = parseInt(location.hash.slice(1), 10);
    if (n) show(n - 1, false);
  });

  fit();
  var start = parseInt(location.hash.slice(1), 10);
  show(start ? start - 1 : 0, false);
})();
</script>
</body>
</html>
